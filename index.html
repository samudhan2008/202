<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>My Music</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#e4f0fa">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Figtree:wght@400;600;800&family=Syne:wght@600;800&family=Rubik:wght@400;500&family=Bowlby+One&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css"></head><body>
<div id="shell" hidden>
  <aside id="side"><div class="brand">♪ My Music</div>
    <a href="#/">Home</a><a href="#/albums">Albums</a><a href="#/songs">Songs</a><a href="#/settings">Settings</a>
    <span class="sp"></span><a href="/admin">Admin panel</a></aside>
  <div id="main">
    <header id="top"><form id="sf" role="search"><input id="q" type="search" placeholder="Search songs, albums, artists" aria-label="Search"></form></header>
    <main id="view"></main>
  </div>
  <div id="bar" hidden>
    <div class="np" data-act="open"><img id="ba" alt=""><div><b id="bt"></b><small id="br"></small></div><button class="ib mini" data-act="play" aria-label="Play or pause">▶</button></div>
    <div id="bmid"></div>
    <div class="rt"><button class="btn sm" data-act="ql"></button><input id="vol" type="range" min="0" max="100" value="100" aria-label="Volume"></div>
  </div>
  <section id="full" aria-label="Now playing">
    <button class="btn" data-act="close" style="align-self:flex-start">Close</button>
    <img id="fa" alt=""><h2 id="ft"></h2><p class="mu" id="fr"></p><div id="fctl"></div>
    <button class="btn sm" data-act="ql" style="margin-top:12px"></button>
  </section>
  <nav id="tabs"><a href="#/">Home</a><a href="#/albums">Albums</a><a href="#/songs">Songs</a><a href="#/settings">Settings</a></nav>
</div>
<script src="/assets/config.js"></script><script src="/assets/core.js"></script>
<script>
const {$,$$,esc,fmt,img,sb}=MM,view=$('#view'),au=new Audio();
let albums=[],tracks=[],byAl=new Map(),ctx=[],q=[],qi=-1,tok=0,genre='',quality=+localStorage.mm_q||320,shuf=false,rep=0;
const pub=x=>x.published!==false,al=t=>byAl.get(t.album_id),artOf=t=>t.art_link||al(t)?.cover_link,who=t=>t.artist||al(t)?.artist||'';
const albTracks=id=>tracks.filter(t=>t.album_id===id).sort((a,b)=>(a.track_no||0)-(b.track_no||0));
const linkFor=t=>quality===320?t.link_320||t.link_128:t.link_128||t.link_320;
const THEMES=[['frost','Frost'],['tide','Tide'],['glow','Afterglow'],['groove','Groove'],['pop','Pop'],['lyric','Lyric'],['dusk','Dusk']];

/* ---------- templates ---------- */
const card=a=>`<a class="card" href="#/album/${a.id}">${img(a.cover_link)}<b>${esc(a.title)}</b><small>${esc(a.artist||'')}${a.year?' · '+a.year:''}</small></a>`;
const row=(t,i)=>`<div class="rw" data-play="${i}" data-tid="${t.id}" tabindex="0"><span class="n">${i+1}</span>${img(artOf(t))}<div class="m"><b>${esc(t.title)}</b><small>${esc(who(t))}</small></div><span class="alb">${al(t)?esc(al(t).title):'Single'}</span><span class="q">${t.link_320?'320 ':''}${t.link_128?'128':''}</span><span class="d">${fmt(t.duration)}</span></div>`;
const rows=l=>(ctx=l,l.length?`<div class="list">${l.map(row).join('')}</div>`:'<p class="mu empty">Nothing here yet.</p>');
const hero=a=>`<section class="hero panel">${img(a.cover_link)}<div><small class="eyebrow">Featured</small><h1>${esc(a.title)}</h1><p class="mu">${esc(a.artist||'')}${a.genre?' · '+esc(a.genre):''}</p>${a.description?`<p>${esc(a.description)}</p>`:''}<div class="acts"><button class="btn pri" data-act="playalbum" data-id="${a.id}">▶ Play</button><a class="btn" href="#/album/${a.id}">View album</a></div></div></section>`;

/* ---------- pages ---------- */
function home(){
  if(!albums.length&&!tracks.length)return '<section class="panel empty"><h2>Your library is empty</h2><p class="mu" style="margin:8px 0 16px">Add your first album in the admin panel.</p><a class="btn pri" href="/admin">Open admin</a></section>';
  const f=albums.find(a=>a.featured)||albums[0];
  return (f?hero(f):'')+(albums.length?`<div class="sec"><h2>New albums</h2><a class="mu" href="#/albums">See all</a></div><div class="grid">${albums.slice(0,8).map(card).join('')}</div>`:'')
   +`<div class="sec"><h2>Recently added songs</h2><a class="mu" href="#/songs">See all</a></div>`+rows(tracks.slice(0,8));
}
function albumsPage(){
  const gs=[...new Set(albums.map(a=>a.genre).filter(Boolean))],l=genre?albums.filter(a=>a.genre===genre):albums;
  return `<h1>Albums</h1>${gs.length?`<div class="chips"><button class="btn sm${genre?'':' pri'}" data-act="genre" data-v="">All</button>${gs.map(g=>`<button class="btn sm${genre===g?' pri':''}" data-act="genre" data-v="${esc(g)}">${esc(g)}</button>`).join('')}</div>`:''}<div class="grid" style="margin-top:18px">${l.map(card).join('')||'<p class="mu">No albums.</p>'}</div>`;
}
function albumPage(id){
  const a=byAl.get(id);if(!a)return '<h1>Album not found</h1>';
  const l=albTracks(id),tot=l.reduce((n,t)=>n+(t.duration||0),0);
  return `<section class="hero panel">${img(a.cover_link)}<div><small class="eyebrow">Album</small><h1>${esc(a.title)}</h1><p class="mu">${esc(a.artist||'')}${a.year?' · '+a.year:''}${a.genre?' · '+esc(a.genre):''} · ${l.length} songs${tot?' · '+Math.round(tot/60)+' min':''}</p>${a.description?`<p>${esc(a.description)}</p>`:''}<div class="acts"><button class="btn pri" data-act="playall">▶ Play</button><button class="btn" data-act="shufall">⤮ Shuffle</button></div></div></section><div style="margin-top:16px">${rows(l)}</div>`;
}
const songsPage=()=>'<h1 style="margin-bottom:14px">Songs</h1>'+rows([...tracks].sort((a,b)=>a.title.localeCompare(b.title)));
function searchPage(s){
  s=(s||'').trim().toLowerCase();if(document.activeElement!==$('#q'))$('#q').value=s;
  if(!s)return '<h1>Search</h1><p class="mu">Type to search your library.</p>';
  const m=(...v)=>v.some(x=>String(x||'').toLowerCase().includes(s));
  const A=albums.filter(a=>m(a.title,a.artist,a.genre)),T=tracks.filter(t=>m(t.title,t.artist,al(t)?.title));
  return `<h1>Results for “${esc(s)}”</h1>${A.length?`<h2 class="sec">Albums</h2><div class="grid">${A.map(card).join('')}</div>`:''}<h2 class="sec">Songs</h2>${rows(T)}`;
}
function settingsPage(){
  const t=document.documentElement.dataset.t;
  return `<h1>Settings</h1><section class="panel"><h3>Theme</h3><div class="chips">${THEMES.map(([k,n])=>`<button class="btn${t===k?' pri':''}" data-act="theme" data-v="${k}">${n}</button>`).join('')}</div></section>
  <section class="panel"><h3>Audio quality</h3><div class="chips">${[128,320].map(k=>`<button class="btn${quality===k?' pri':''}" data-act="setq" data-v="${k}">${k} kbps</button>`).join('')}</div><small>Falls back to the other file when one is missing.</small></section>
  <section class="panel"><h3>Account</h3><div class="chips"><button class="btn" data-act="out">Sign out</button><a class="btn" href="/admin">Admin panel</a></div></section>`;
}
const routes=[[/^\/?$/,home],[/^\/albums$/,albumsPage],[/^\/album\/(.+)$/,albumPage],[/^\/songs$/,songsPage],[/^\/search\/?(.*)$/,searchPage],[/^\/settings$/,settingsPage]];
function route(){
  const h=decodeURIComponent(location.hash.slice(1))||'/';
  for(const [r,f] of routes){const m=h.match(r);if(m){view.innerHTML=f(...m.slice(1));break}}
  MM.hydrate(view);markNow();
  $$('#side a[href^="#"],#tabs a').forEach(a=>{const p=a.getAttribute('href').slice(1);a.classList.toggle('on',p==='/'?h==='/':h.startsWith(p))});
  scrollTo(0,0);
}
addEventListener('hashchange',route);
let st;$('#q').oninput=e=>{clearTimeout(st);st=setTimeout(()=>{location.hash='#/search/'+encodeURIComponent(e.target.value)},250)};
$('#sf').onsubmit=e=>e.preventDefault();

/* ---------- player ---------- */
const ctl=()=>`<div class="ctl"><button class="ib" data-act="shuf" aria-label="Shuffle" aria-pressed="false">⤮</button><button class="ib" data-act="prev" aria-label="Previous">⏮</button><button class="ib big" data-act="play" aria-label="Play or pause">▶</button><button class="ib" data-act="next" aria-label="Next">⏭</button><button class="ib" data-act="rep" aria-label="Repeat">↻</button></div><div class="seek"><span class="tc">0:00</span><input class="sk" type="range" min="0" max="1000" value="0" aria-label="Seek"><span class="td">0:00</span></div>`;
$('#bmid').innerHTML=ctl();$('#fctl').innerHTML=ctl();
const setPlay=t=>$$('[data-act=play]').forEach(b=>b.textContent=t);
const qlab=()=>$$('[data-act=ql]').forEach(b=>b.textContent=quality+' kbps');qlab();
const markNow=()=>$$('[data-tid]').forEach(r=>r.classList.toggle('now',!!q[qi]&&r.dataset.tid===q[qi].id));
function start(i){q=ctx.slice();play(i)}
async function play(i){
  qi=i;const t=q[i],my=++tok;setNow(t);markNow();const l=linkFor(t);if(!l)return next();
  setPlay('…');
  try{const u=await MM.blob(l,true);if(my!==tok)return;au.src=u;await au.play();
    const nx=q[i+1],nl=nx&&linkFor(nx);if(nl)MM.blob(nl,true).catch(()=>{});
  }catch{if(my===tok)setPlay('▶')}
}
async function setNow(t){
  $('#bar').hidden=false;
  $('#bt').textContent=$('#ft').textContent=t.title;$('#br').textContent=$('#fr').textContent=who(t);
  $('#ba').removeAttribute('src');$('#fa').removeAttribute('src');
  const art=artOf(t);if(art){const u=await MM.blob(art).catch(()=>null);if(u){$('#ba').src=$('#fa').src=u}}
  if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:who(t),album:al(t)?.title||'Single',artwork:$('#ba').src?[{src:$('#ba').src}]:[]});
}
function next(auto){
  if(!q.length)return;if(auto&&rep===2)return play(qi);
  let i=shuf?Math.floor(Math.random()*q.length):qi+1;
  if(i>=q.length){if(rep===1)i=0;else return setPlay('▶')}
  play(i);
}
const prev=()=>au.currentTime>3?au.currentTime=0:play(Math.max(0,qi-1));
au.onended=()=>next(true);
au.onplay=au.onpause=()=>setPlay(au.paused?'▶':'❚❚');
au.ontimeupdate=()=>{if(au.duration){$$('.sk').forEach(s=>s.value=au.currentTime/au.duration*1000);$$('.tc').forEach(s=>s.textContent=fmt(au.currentTime)||'0:00');$$('.td').forEach(s=>s.textContent=fmt(au.duration))}};
document.addEventListener('input',e=>{
  if(e.target.classList.contains('sk')&&au.duration)au.currentTime=e.target.value/1000*au.duration;
  if(e.target.id==='vol')au.volume=e.target.value/100;
});
const A={
  play:()=>au.src?(au.paused?au.play():au.pause()):ctx.length&&start(0),
  next:()=>next(),prev,
  shuf:()=>{shuf=!shuf;$$('[data-act=shuf]').forEach(b=>b.setAttribute('aria-pressed',shuf))},
  rep:()=>{rep=(rep+1)%3;$$('[data-act=rep]').forEach(b=>b.textContent=['↻','🔁','🔂'][rep])},
  ql:()=>{quality=quality===320?128:320;localStorage.mm_q=quality;qlab()},
  open:()=>$('#full').classList.add('open'),close:()=>$('#full').classList.remove('open'),
  playall:()=>start(0),shufall:()=>{shuf=true;A.shuf();shuf=true;$$('[data-act=shuf]').forEach(b=>b.setAttribute('aria-pressed','true'));start(Math.floor(Math.random()*ctx.length))},
  playalbum:b=>{ctx=albTracks(b.dataset.id);start(0)},
  genre:b=>{genre=b.dataset.v;route()},
  theme:b=>{document.documentElement.dataset.t=localStorage.mm_theme=b.dataset.v;route()},
  setq:b=>{quality=+b.dataset.v;localStorage.mm_q=quality;qlab();route()},
  out:MM.signOut
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(b&&A[b.dataset.act]){A[b.dataset.act](b);return}
  const p=e.target.closest('[data-play]');if(p)start(+p.dataset.play);
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-play]'))e.target.click()});
if('mediaSession' in navigator){const m=navigator.mediaSession;m.setActionHandler('play',()=>au.play());m.setActionHandler('pause',()=>au.pause());m.setActionHandler('nexttrack',()=>next());m.setActionHandler('previoustrack',prev)}

/* ---------- boot ---------- */
MM.gate('My Music',async()=>{
  $('#shell').hidden=false;
  try{
    const [a,t]=await Promise.all([sb('/rest/v1/albums?select=*&order=created_at.desc'),sb('/rest/v1/tracks?select=*&order=created_at.desc')]);
    albums=a.filter(pub);byAl=new Map(albums.map(x=>[x.id,x]));
    tracks=t.filter(x=>pub(x)&&(!x.album_id||byAl.has(x.album_id)));
  }catch(e){view.innerHTML=`<section class="panel"><h2>Could not load your library</h2><p class="mu">${esc(e.message)}</p></section>`;return}
  route();
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
